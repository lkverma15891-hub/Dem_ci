
pipeline:
  name: App Package and Publish
  identifier: cicd_app_package_and_publish
  projectIdentifier: <+project.identifier>
  orgIdentifier: <+org.identifier>

  #═════════════════════════════════════════════════════════════════════════════
  # 📦 ARTIFACT PACKAGING & PUBLISHING PIPELINE
  #═════════════════════════════════════════════════════════════════════════════
  # Features:
  #  • Semantic Versioning from Git tags (1.2.5-rc123)
  #  • Auto-triggers on merge to main & hotfix pushes
  #  • Full security: checksums, SBOM, signatures
  #  • Complete traceability: Git tag → Commit → Artifact
  #
  # See README.md for setup and usage
  #═════════════════════════════════════════════════════════════════════════════

  #═════════════════════════════════════════════════════════════════════════════
  # PIPELINE TRIGGERS
  #═════════════════════════════════════════════════════════════════════════════
  # Auto-triggers: 1) PR merged to main  2) Push to hotfix/* branches
  #═════════════════════════════════════════════════════════════════════════════

  triggers:
    # Trigger 1: Merge to Main (runs when PR is merged to main)
    - name: Trigger on Merge to Main
      identifier: merge_to_main_trigger
      enabled: true
      orgIdentifier: <+pipeline.orgIdentifier>
      projectIdentifier: <+pipeline.projectIdentifier>
      pipelineIdentifier: cicd_app_package_and_publish
      source:
        type: Webhook
        spec:
          type: Github
          spec:
            type: PullRequest
            spec:
              connectorRef: account.github_devops_connector
              autoAbortPreviousExecutions: false
              payloadConditions:
                - key: targetBranch
                  operator: Equals
                  value: main
                - key: action
                  operator: Equals
                  value: merged
              headerConditions: []
              repoName: <+trigger.payload.repository.name>
              actions:
                - Closed
      inputYaml: |
        pipeline:
          identifier: cicd_app_package_and_publish
          properties:
            ci:
              codebase:
                build:
                  type: branch
                  spec:
                    branch: <+trigger.targetBranch>

    # Trigger 2: Hotfix Push (runs on push to hotfix/* branches)
    - name: Trigger on Hotfix Push
      identifier: hotfix_push_trigger
      enabled: true
      orgIdentifier: <+pipeline.orgIdentifier>
      projectIdentifier: <+pipeline.projectIdentifier>
      pipelineIdentifier: cicd_app_package_and_publish
      source:
        type: Webhook
        spec:
          type: Github
          spec:
            type: Push
            spec:
              connectorRef: account.github_devops_connector
              autoAbortPreviousExecutions: false
              payloadConditions:
                - key: ref
                  operator: Regex
                  value: ^refs/heads/hotfix/.*
              headerConditions: []
              repoName: <+trigger.payload.repository.name>
              actions: []
      inputYaml: |
        pipeline:
          identifier: cicd_app_package_and_publish
          properties:
            ci:
              codebase:
                build:
                  type: branch
                  spec:
                    branch: <+trigger.sourceBranch>

  # Repository: Clones devops-automation scripts

  properties:
    ci:
      codebase:
        connectorRef: account.github_devops_connector
        repoName: DevOps/devops-automation
        build: <+input>.default(main)

  stages:
    - stage:
        name: App Package and Publish
        identifier: app_package_publish
        type: CI
        spec:
          cloneCodebase: true
          runtime:
            type: Cloud
            spec: {}

          # Artifact from upstream build pipeline
          sharedPaths:
            - /harness/demo.jar

          execution:
            steps:

              # STEP 1: Verify JAR artifact from upstream build

              - step:
                  type: Run
                  name: Verify JAR Artifact
                  identifier: verify_jar_artifact
                  spec:
                    shell: Bash
                    command: |
                      echo "🔍 Verifying JAR artifact from build pipeline..."

                      JAR_PATH="/harness/demo.jar"

                      if [ -f "$JAR_PATH" ]; then
                        echo "✅ Found JAR artifact"
                        cp "$JAR_PATH" ./demo.jar

                        # Export metadata
                        BUILD_ID="<+pipeline.executionId>"
                        COMMIT_SHA="<+codebase.commitSha>"
                        BRANCH="<+codebase.branch>"

                        echo "export BUILD_ID=$BUILD_ID" >> $HARNESS_ENV
                        echo "export COMMIT_SHA=$COMMIT_SHA" >> $HARNESS_ENV
                        echo "export BRANCH=$BRANCH" >> $HARNESS_ENV
                        echo "export JAR_FILE=demo.jar" >> $HARNESS_ENV

                        echo "✅ JAR artifact ready for packaging!"
                      else
                        echo "❌ ERROR: JAR artifact not found at $JAR_PATH"
                        exit 1
                      fi

              # STEP 2: Set Version (Semantic Versioning)
              # Generates version from Git tags: MAJOR.MINOR.PATCH-rcBUILD

              - step:
                  type: Run
                  name: Set Version
                  identifier: set_version
                  spec:
                    shell: Bash
                    command: |
                      echo "🏷️  Generating Semantic Version..."

                      export BUILD_NUMBER="${BUILD_ID}"
                      export BRANCH_NAME="${BRANCH}"
                      export PR_LABEL="${PR_LABEL:-patch}"

                      python3 devops-automation/scripts/set_version.py

                      VERSION=$(cat version.txt)
                      echo "✅ Version: ${VERSION}"

              # STEP 3: Prepare package metadata

              - step:
                  type: Run
                  name: Prepare Package
                  identifier: prepare_package
                  spec:
                    shell: Bash
                    command: |
                      echo "📦 Preparing package..."
                      python3 devops-automation/scripts/package_app.py

              # STEP 4: Package deployment templates

              - step:
                  type: Run
                  name: Package Deploy Template
                  identifier: package_deploy_template
                  spec:
                    shell: Bash
                    command: |
                      echo "📦 Packaging deployment templates..."
                      python3 devops-automation/scripts/package_deploy_template.py

              # STEP 5: Generate checksums

              - step:
                  type: Run
                  name: Generate Checksums
                  identifier: checksum
                  spec:
                    shell: Bash
                    command: |
                      echo "🔐 Generating SHA-256 checksums..."
                      python3 devops-automation/scripts/checksum.py

              # STEP 6: Create SBOM

              - step:
                  type: Run
                  name: Create SBOM
                  identifier: create_sbom
                  spec:
                    shell: Bash
                    command: |
                      echo "📋 Creating Software Bill of Materials..."
                      python3 devops-automation/scripts/create_sbom.py

              # STEP 7: Sign packages

              - step:
                  type: Run
                  name: Sign Packages
                  identifier: sign_package
                  spec:
                    shell: Bash
                    command: |
                      echo "✍️  Signing packages..."
                      python3 devops-automation/scripts/sign_package.py

              # STEP 8: Publish to JFrog Artifactory

              - step:
                  type: Run
                  name: Publish to Artifactory
                  identifier: publish_package
                  spec:
                    shell: Bash
                    command: |
                      echo "🚀 Publishing artifacts to JFrog Artifactory..."

                      export ARTIFACTORY_URL="${JFROG_URL:-https://artifactory.company.com}"
                      export ARTIFACTORY_USERNAME="${JFROG_USERNAME}"
                      export ARTIFACTORY_PASSWORD="${JFROG_PASSWORD}"
                      export ARTIFACTORY_REPO="${JFROG_REPO:-libs-release-local}"
                      export APP_NAME="${APP_NAME:-demo}"

                      python3 devops-automation/scripts/publish_package.py

                      if [ $? -eq 0 ]; then
                        echo "✅ All artifacts published successfully!"
                        echo "🔗 Artifact URL: ${ARTIFACTORY_URL}/${ARTIFACTORY_REPO}/${APP_NAME}/${VERSION}/"
                      else
                        echo "❌ Failed to publish artifacts"
                        exit 1
                      fi
